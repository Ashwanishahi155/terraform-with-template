trigger: none

pool:
  name: terraform-agent-pool

parameters:
- name: environment
  displayName: Select Environment
  type: string
  default: dev
  values:
  - dev
  - prod

stages:
- stage: Test
  jobs:
  - job: TestTemplate
    steps:
    - template: templates/pipelines/terraform-plan.yml
      parameters:
        environment: ${{ parameters.environment }}